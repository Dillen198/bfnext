# Run from the repo root: docker compose -f deploy/frontend/docker-compose.yml up -d --build
#
# Set VITE_API_BASE in a .env file next to this compose file (or export it in
# the shell before running) to the public HTTPS origin of your bfdb instance,
# e.g. VITE_API_BASE=https://api.example.com
#
# Point your reverse proxy / DNS at:
#   dashboard container (port 8081) -> https://dashboard.example.com
#   site container      (port 8082) -> https://example.com

services:
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/frontend/Dockerfile
      args:
        APP: bfweb
        VITE_API_BASE: ${VITE_API_BASE}
    restart: unless-stopped
    ports:
      - "8081:80"

  site:
    build:
      context: ../..
      dockerfile: deploy/frontend/Dockerfile
      args:
        APP: bfsite
        VITE_API_BASE: ${VITE_API_BASE}
    restart: unless-stopped
    ports:
      - "8082:80"
