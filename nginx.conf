# Global Configuration
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    # ══════════════════════════════════════════════════════════
    # 1. DOMAIN PROXY BLOCK (gci.gvaw.web.id on Port 80)
    # ══════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name gci.gvaw.web.id;

        # Keep ACME/Let's Encrypt validation files working
        location /.well-known/acme-challenge/ {
            root C:/nginx/html;
        }

        # Proxy to bfdb enroute server on port 8765
        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;

            # Enable WebSockets for real-time enroute radar sweeps
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent radar scope WebSocket from disconnecting (timeouts)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # ══════════════════════════════════════════════════════════
    # 2. PORT 6080 PROXY BLOCK (Direct IP Access)
    # ══════════════════════════════════════════════════════════
    server {
        listen 6080;
        server_name _;

        # Proxy to bfdb enroute server on port 8765
        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;

            # Enable WebSockets for real-time enroute radar sweeps
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent radar scope WebSocket from disconnecting (timeouts)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}