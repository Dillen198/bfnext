# Stable rustfmt options only: nightly-only settings are ignored (with a
# warning) by the stable toolchain the project builds with, so they are not
# listed. `cargo fmt` passes each crate's own edition from its Cargo.toml;
# the edition here applies when rustfmt is run directly on a file.
edition = "2021"
max_width = 90
hard_tabs = false
tab_spaces = 4
newline_style = "Auto"
use_small_heuristics = "Max"
fn_params_layout = "Tall"
match_block_trailing_comma = false
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
merge_derives = true
use_try_shorthand = false
use_field_init_shorthand = false
force_explicit_abi = true
