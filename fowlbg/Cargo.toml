[package]
name = "fowlbg"
version = "0.1.0"
edition = "2024"
authors = ["Dillen Weerasinghe <dillen.weerasinghe98@gmail.com>"]
license = "MIT"
publish = false
description = "The background-thread plumbing the Vector Strike mission DLLs share (bflib, bfrange): the line-buffered logger, log and JSONL rotation, the supervised tokio thread, and the netidx publisher setup, with opt-in netidx TLS."

[features]
default = ["runtime"]
# Everything but the netidx client config (`netidx::Tls`, `netidx::load_config`).
# bfprotocols turns it off: it only needs the config type, not a runtime.
runtime = ["dep:bytes", "dep:chrono", "dep:futures", "dep:log", "dep:once_cell", "dep:simplelog", "dep:tokio"]
# `JsonSchema` for `netidx::Tls`, for config files that publish a schema.
schemars = ["dep:schemars"]

[dependencies]
anyhow = { workspace = true }
netidx = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
log = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
simplelog = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
