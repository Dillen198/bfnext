[package]
name = "bfdb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bfdb"

[dependencies]
anyhow = { workspace = true }
arrayvec = { workspace = true }
base64 = { workspace = true }
bfprotocols = { version = "0.1.0", path = "../bfprotocols" }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# `dcso3` here is dcso3-core under dcso3's name: the same types at the same
# paths (dcso3::net::Ucid, dcso3::coalition::Side, ...) without mlua, so
# this crate builds and runs without DCS's lua.dll. Code that needs the Lua
# side of dcso3 depends on dcso3 itself.
dcso3 = { package = "dcso3-core", version = "0.1", path = "../dcso3-core" }
enumflags2 = { workspace = true, features = ["serde"] }
env_logger = { workspace = true }
futures = { workspace = true }
fxhash = { workspace = true }
log = { workspace = true }
netidx-protocols = { workspace = true }
netidx = { workspace = true }
netidx-archive = { workspace = true }
arcstr = { workspace = true }
paste = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sled = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
warp = { workspace = true }
yats = { version = "0.1", path = "../yats" }
rust-embed = { version = "8", features = ["warp-ex"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart"] }
urlencoding = "2"
sysinfo = "0.32"
nvml-wrapper = "0.10"
# Live GCI: native SRS voice client. Opus encoding is done by dynamically
# loading opus.dll at runtime (the one that ships with DCS-SRS) via libloading,
# so there is no build-time native/CMake dependency. hound reads the WAV that
# the TTS engine (Piper or Windows SAPI) produces.
libloading = "0.8"
hound = "3"
# Training range (src/range): result cards are SVG strings rasterised to PNG
# for Discord embeds (resvg, pure Rust, system fonts), and the per-result
# debrief tracks are stored zstd-compressed.
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
zstd = { workspace = true }
# Flight replay (src/replay): Tacview `.zip.acmi` recordings in, gzip'd
# track files out (served with Content-Encoding: gzip).
zip = { workspace = true }
flate2 = "1"
# Public snapshot (src/snapshot.rs): AWS SigV4 signing for the uploads to R2.
# Both were already in the build through the TLS stack.
sha2 = "0.10"
hmac = "0.12"
