  <text x="410.0" y="428.0" font-size="12.5" fill="#7d8a6a">shut down when an anti-radiation missile is inbound.</text>
  <text x="410.0" y="452.0" font-size="12.5" fill="#8ec83f">Destroyed or captured: every linked site falls back to plain DCS AI.</text>
