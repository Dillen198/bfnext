  <text x="595.0" y="350.0" font-size="12.5" fill="#7d8a6a" text-anchor="middle">Every SAM site links to its nearest friendly CC</text>
  <text x="410.0" y="394.0" font-size="14" fill="#cdd4be" font-weight="600">While it stands, its SAM sites are networked</text>
