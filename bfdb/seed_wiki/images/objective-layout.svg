<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 670" width="800" height="670" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="670" fill="#0d1009"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#cdd4be">An objective on the F10 map</text>
  <text x="30" y="54" font-size="13" fill="#7d8a6a">Not to scale. Rings and hexes are drawn on the ground; the label is fixed-size text.</text>

  <!-- threatened ring: max(logistics_exclusion, 1.1 x zone) -->
  <circle cx="300" cy="320" r="235" fill="none" stroke="#c9a227" stroke-width="5"/>
  <!-- owner ring = the zone -->
  <circle cx="300" cy="320" r="140" fill="none" stroke="#4a8fd4" stroke-width="3" stroke-dasharray="12 8"/>
  <!-- capturable ring at 0.9 x zone -->
  <circle cx="300" cy="320" r="126" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>

  <!-- kind icon: logistics hexagon -->
  <polygon points="300,290 326,305 326,335 300,350 274,335 274,305" fill="none" stroke="#4a8fd4" stroke-width="3"/>

  <!-- logistics buildings with pins -->
  <g fill="#7d8a6a" stroke="#262e1d" stroke-width="1">
    <rect x="232" y="262" width="22" height="16"/>
    <rect x="352" y="252" width="26" height="14"/>
    <rect x="344" y="356" width="18" height="18"/>
    <rect x="226" y="352" width="24" height="14"/>
  </g>
  <g fill="#ffd24a">
    <path d="M243,262 l-5,-12 a5,5 0 1 1 10,0 z"/>
    <path d="M365,252 l-5,-12 a5,5 0 1 1 10,0 z"/>
    <path d="M353,356 l-5,-12 a5,5 0 1 1 10,0 z"/>
    <path d="M238,352 l-5,-12 a5,5 0 1 1 10,0 z"/>
  </g>

  <!-- capture squad inside the capture ring -->
  <g fill="#cc4444">
    <polygon points="372,300 379,312 365,312"/>
    <polygon points="386,306 393,318 379,318"/>
    <polygon points="378,320 385,332 371,332"/>
  </g>

  <!-- status hexes, 1100 m south of centre: health, logi, supply, fuel -->
  <g stroke="#000000" stroke-opacity="0.8" stroke-width="2">
    <polygon points="234,388 250,397 250,415 234,424 218,415 218,397" fill="#33d94f" fill-opacity="0.5"/>
    <polygon points="279,388 295,397 295,415 279,424 263,415 263,397" fill="#ffb300" fill-opacity="0.5"/>
    <polygon points="324,388 340,397 340,415 324,424 308,415 308,397" fill="#f22929" fill-opacity="0.5"/>
    <polygon points="369,388 385,397 385,415 369,424 353,415 353,397" fill="#33d94f" fill-opacity="0.5"/>
  </g>
  <g font-size="12" fill="#cdd4be" text-anchor="middle">
    <text x="234" y="440">Health</text>
    <text x="279" y="440">Logi</text>
    <text x="324" y="440">Supply</text>
    <text x="369" y="440">Fuel</text>
  </g>

  <!-- label to the north-east -->
  <rect x="368" y="150" width="252" height="42" fill="#000000" fill-opacity="0.5"/>
  <text x="374" y="166" font-size="13" fill="#4a8fd4">Saraqib Logistics Hub</text>
  <text x="374" y="184" font-size="12" fill="#4a8fd4">&gt;&gt; UNDEFENDED - RED captures: ...</text>
  <line x1="368" y1="192" x2="330" y2="250" stroke="#7d8a6a" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- legend -->
  <g font-size="13">
    <line x1="560" y1="250" x2="590" y2="250" stroke="#4a8fd4" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="598" y="246" fill="#cdd4be">Owner ring = the zone.</text>
    <text x="598" y="263" fill="#7d8a6a">Troops capture inside it.</text>

    <line x1="560" y1="296" x2="590" y2="296" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
    <text x="598" y="292" fill="#cdd4be">Inner ring, white:</text>
    <text x="598" y="309" fill="#7d8a6a">capturable right now.</text>

    <line x1="560" y1="342" x2="590" y2="342" stroke="#c9a227" stroke-width="5"/>
    <text x="598" y="338" fill="#cdd4be">Yellow ring: threatened.</text>
    <text x="598" y="355" fill="#7d8a6a">Radius = logistics exclusion</text>
    <text x="598" y="371" fill="#7d8a6a">or 1.1x the zone, if bigger.</text>

    <path d="M575,410 l-5,-12 a5,5 0 1 1 10,0 z" fill="#ffd24a"/>
    <text x="598" y="400" fill="#cdd4be">logi: pin on each counted</text>
    <text x="598" y="417" fill="#7d8a6a">logistics building (max 4).</text>

    <polygon points="575,446 582,458 568,458" fill="#cc4444"/>
    <text x="598" y="450" fill="#cdd4be">Your capture squad,</text>
    <text x="598" y="467" fill="#7d8a6a">inside the ring.</text>
  </g>
  <text x="30" y="596" font-size="13" fill="#7d8a6a">Hex colours: green above 66%, amber 34-66%, red 33% or less.</text>
  <text x="30" y="614" font-size="13" fill="#7d8a6a">Gold outline on the supply hex: unlimited supply. Gold owner ring: unlimited aircraft.</text>
  <text x="30" y="632" font-size="13" fill="#7d8a6a">Kind icon in the middle: tent FOB, H FARP, hexagon hub, factory, star command center,</text>
  <text x="30" y="650" font-size="13" fill="#7d8a6a">anchor naval base, ship hull carrier, boxed missile SAM site. Airbases have none of ours.</text>
</svg>
