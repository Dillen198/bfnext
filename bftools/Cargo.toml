[package]
name = "bftools"
version = "0.1.0"
edition = "2021"

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false

# Its own workspace (own Cargo.lock, vendored Lua). Without this table cargo
# walks up looking for a workspace root, which fails when the checkout sits
# inside another one (e.g. a git worktree under the main checkout).
[workspace]

[[bin]]
name = "bftools"

[dependencies]
anyhow = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_derive = "1"
zip = "0.6.6"
clap = { version = "4.4.18", features = ["derive"] }
env_logger = "0.11.0"
log = "0.4.20"
mlua = { version = "0.9.9", features = [ "lua51", "serialize", "vendored" ] }
dcso3 = { version = "0.1", path = "../dcso3" }
# Live weather/time (--live-weather, --live-time), shared with bflib/bfrange.
livewx = { version = "0.1", path = "../livewx" }
bfprotocols = { version = "0.1", path = "../bfprotocols" }
compact_str = { version = "0.8", features = ["serde"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
chrono = "0.4"
