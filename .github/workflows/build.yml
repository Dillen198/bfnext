name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # DCS embeds Lua 5.1 and we must link the exact same runtime, so mlua is
  # pointed at the lua.lib/lua.dll committed at the repo root (see
  # setup-build.ps1). `$GITHUB_WORKSPACE` is not expanded inside `env:`
  # values, hence the expression syntax.
  LUA_LIB: ${{ github.workspace }}
  LUA_LINK: dylib
  LUA_LIB_NAME: lua

jobs:
  check:
    # Windows only: the engine is a DCS (Windows) DLL, the cockpit installer
    # uses native Win32 GUI bindings, and the committed Lua import library is
    # a Windows .lib.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            bftools

      # dcso3/bflib/bfrange/bfdb link lua.dll dynamically, so every test
      # binary needs it on PATH at run time.
      - name: Put lua.dll on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value $env:GITHUB_WORKSPACE

      # bfdb embeds the dashboard and site builds (bfweb/dist, bfsite/dist,
      # both gitignored) with RustEmbed, which refuses to compile if a folder
      # is missing. This job only checks the Rust side (the frontend job
      # builds them for real), so placeholder pages stand in for the npm
      # builds. Not empty folders: bfdb's route tests load the SPA fallback,
      # which serves index.html.
      - name: Stub frontend build output
        shell: pwsh
        run: |
          foreach ($d in 'bfweb/dist', 'bfsite/dist') {
            New-Item -ItemType Directory -Force $d | Out-Null
            Set-Content -Path "$d/index.html" -Value '<!doctype html><title>CI placeholder</title>'
          }

      - name: cargo check (workspace)
        run: cargo check --workspace --locked

      # No crate is excluded: the tests need no DCS, no netidx resolver and no
      # network (dcso3's tests spin up a plain Lua state via lua.dll; bfdb's
      # DB tests use throwaway sled dirs under the temp dir), and
      # bfcockpit/installer has no tests and builds fine on a Windows runner
      # (it only embeds a committed Lua script, no frontend build step).
      - name: cargo test (workspace)
        run: cargo test --workspace --locked

      # bftools is excluded from the workspace (own Cargo.lock, vendored Lua),
      # so it is checked on its own.
      - name: cargo check (bftools)
        run: cargo check --locked --manifest-path bftools/Cargo.toml

  # Formatting and lints. Both fail the run: keep the tree rustfmt-clean and
  # clippy-clean. Lints the code does not follow on purpose are allowed, with
  # reasons, in the root Cargo.toml's [workspace.lints.clippy].
  rust-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Stub frontend build output
        shell: pwsh
        run: |
          foreach ($d in 'bfweb/dist', 'bfsite/dist') {
            New-Item -ItemType Directory -Force $d | Out-Null
            Set-Content -Path "$d/index.html" -Value '<!doctype html><title>CI placeholder</title>'
          }

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Fowl Engine Manager (bfmanager/src-tauri) is not a workspace member: it
  # has its own Cargo.lock. Its build needs what `tauri build` would normally
  # stage first -- the UI in bfmanager/dist (built from bfweb by
  # vite.manager.config.ts) and the bundled resources/bot and resources/range
  # (scripts/stage-*.mjs) -- because tauri-build and generate_context! check
  # that they exist. The tests do not look at the UI, so a placeholder page
  # stands in for it; the stage scripts need only Node, no npm install.
  manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: bfmanager/src-tauri

      - name: Stage the Manager's UI and bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bfmanager/dist | Out-Null
          Set-Content -Path bfmanager/dist/index.html -Value '<!doctype html><title>CI placeholder</title>'
          node bfmanager/scripts/stage-bot.mjs
          if ($LASTEXITCODE) { throw "stage-bot failed" }
          node bfmanager/scripts/stage-range.mjs
          if ($LASTEXITCODE) { throw "stage-range failed" }

      - name: cargo test (bfmanager)
        run: cargo test --locked --manifest-path bfmanager/src-tauri/Cargo.toml

  # The web apps: bfweb (dashboard + Manager UI), bfsite (public site, embedded
  # in bfdb), bfwiki and bfrange-web. Each step uses --if-present, so an app
  # without a typecheck/lint/test script just skips it. Node 22: Vite 8 wants
  # 20.19 or newer. Install scripts are skipped, as in the release builds.
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [bfweb, bfsite, bfwiki, bfrange-web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present

  # Offline tests for the DCSServerBot plugin (fakes of the bot's `core`; no
  # bot, Discord, DCS or database). Windows, like the server box it runs on.
  bot:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DCSServerBot/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DCSServerBot/tests/requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Compile every bot file
        run: python -m compileall -q ..

      - run: python -m pytest -q
