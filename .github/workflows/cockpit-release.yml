# Builds the Vector Strike cockpit plugin on a Windows runner and publishes
# GitHub release cockpit-v<version> (bfcockpit/release.ps1): the installer and
# the zip, each with a .minisig. Installed copies (bfcockpit_net.dll) run a
# downloaded installer only if it verifies against the key in
# bfcockpit/net/updater.pub. Manual only.
#
# Three jobs, as in release.yml: `build` has no secrets and a read-only token;
# `sign` runs on a fresh runner on the `cockpit-release` environment, which
# holds FOWL_COCKPIT_SIGNING_KEY (the contents of fowl-cockpit.key) and
# FOWL_COCKPIT_SIGNING_PASSWORD, and runs only the signer, from this
# workflow's own commit; `publish` alone can write to the repo. Give the
# environment required reviewers and limit its deployment branches to vector
# and main (bfcockpit/README.md, "Releasing").
name: Cockpit release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or cockpit-v* tag to build (vector, main or cockpit-v<version>)
        default: vector
      notes:
        description: "Release notes (default: version and commit)"
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # the committed lua.lib (setup-build.ps1); not expanded inside `env:`
      # without the expression syntax
      LUA_LIB: ${{ github.workspace }}
      LUA_LINK: dylib
      LUA_LIB_NAME: lua
    steps:
      - name: Check the ref
        shell: pwsh
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ($env:REF -notmatch '^(vector|main|cockpit-v[0-9]+(\.[0-9]+){1,3})$') {
            throw "ref '$($env:REF)' is not vector, main or a cockpit-v<version> tag"
          }
      # actions pinned to commit SHAs (the tag each one was, in the comment)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build (no secrets)
        shell: pwsh
        run: ./bfcockpit/release.ps1 -DryRun -NoSign -OutDir (Join-Path $env:RUNNER_TEMP 'cockpit-out')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cockpit-release-unsigned
          path: ${{ runner.temp }}/cockpit-out/
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: cockpit-release
    permissions:
      contents: read
    steps:
      # this workflow's own commit, not inputs.ref (see release.yml)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cockpit-release-unsigned
          path: ${{ runner.temp }}/cockpit-out
      - name: Install the signer (no install scripts)
        shell: pwsh
        run: |
          npm --prefix bfmanager ci --no-audit --no-fund --ignore-scripts
          if ($LASTEXITCODE) { throw "npm ci (bfmanager) failed" }
      - name: Sign
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.FOWL_COCKPIT_SIGNING_KEY }}
          FOWL_COCKPIT_SIGNING_PASSWORD: ${{ secrets.FOWL_COCKPIT_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_KEY) { throw "no FOWL_COCKPIT_SIGNING_KEY secret on the cockpit-release environment" }
          $key = Join-Path $env:RUNNER_TEMP 'fowl-cockpit.key'
          Set-Content -Path $key -Value $env:SIGNING_KEY -NoNewline
          try {
            ./bfcockpit/release.ps1 -DryRun -NoBuild -OutDir (Join-Path $env:RUNNER_TEMP 'cockpit-out') -KeyPath $key
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
      - name: Remove the signing key
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'fowl-cockpit.key') -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cockpit-release-signatures
          path: ${{ runner.temp }}/cockpit-out/*.minisig
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [build, sign]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cockpit-release-unsigned
          path: ${{ runner.temp }}/cockpit-out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cockpit-release-signatures
          path: ${{ runner.temp }}/cockpit-out
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $a = @{ NoBuild = $true; NoSign = $true; Repo = $env:GITHUB_REPOSITORY
                  OutDir = (Join-Path $env:RUNNER_TEMP 'cockpit-out') }
          if ($env:RELEASE_NOTES) { $a.Notes = $env:RELEASE_NOTES }
          ./bfcockpit/release.ps1 @a
