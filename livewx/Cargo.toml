[package]
name = "livewx"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Real-world weather and time for a DCS mission file: fetches METAR (CheckWX) and open-meteo, and rewrites the .miz before the mission next loads. Shared by bflib (campaign) and bfrange (training range)."

[dependencies]
anyhow = { workspace = true }
bfprotocols = { version = "0.1", path = "../bfprotocols" }
chrono = { workspace = true }
dcso3 = { version = "0.1", path = "../dcso3" }
log = { workspace = true }
# No "module": livewx is an rlib, the cdylibs that link it (bflib, bfrange)
# turn module mode on themselves, and bftools links it with vendored Lua.
mlua = { workspace = true, features = ["serialize"] }
serde_json = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
